---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yaook-magnum
  namespace: yaook
  labels:
    app.kubernetes.io/name: yaook-magnum
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yaook-magnum-manager
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.yaook.cloud
  resources:
  - amqpservers
  - amqpusers
  - mysqlservices
  - mysqlusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - magnum.yaook.cloud
  resources:
  - magnumdeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - magnum.yaook.cloud
  resources:
  - magnumdeployments/finalizers
  verbs:
  - update
- apiGroups:
  - magnum.yaook.cloud
  resources:
  - magnumdeployments/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - yaook.cloud
  resources:
  - keystoneendpoints
  - keystoneusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yaook-magnum-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yaook-magnum-manager
subjects:
  - kind: ServiceAccount
    name: yaook-magnum
    namespace: yaook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaook-magnum-operator
  namespace: yaook
  labels:
    app.kubernetes.io/name: yaook-magnum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yaook-magnum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yaook-magnum
    spec:
      serviceAccountName: yaook-magnum
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/the-it-dept/yaook-magnum:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
